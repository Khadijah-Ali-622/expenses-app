<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E6B56">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <meta name="application-name" content="Expenses">
  <meta name="color-scheme" content="light dark">
  <title>Expenses</title>
  <link rel="manifest" href="pwa/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="pwa/icon-192.png">
  <link rel="apple-touch-icon" href="pwa/icon-192.png">
  <style>
:root {
  --bg: #F3F0E8;
  --bg-warm: #EAE6DA;
  --surface: #FFFcf7;
  --surface-2: #F7F3EB;
  --text: #1B221F;
  --text-muted: #5E6C66;
  --border: #E4DDD0;
  --primary: #0E6B56;
  --primary-hover: #0A5746;
  --primary-soft: #DCEFE8;
  --primary-ink: #0E6B56;
  --expense: #C4473A;
  --expense-soft: #F8E6E3;
  --income: #1B7A4A;
  --income-soft: #DCEFE4;
  --warn: #B87614;
  --warn-soft: #F8EBD3;
  --danger: #C4473A;
  --overlay: rgba(20, 24, 22, 0.45);
  --shadow: 0 8px 28px rgba(27, 34, 31, 0.08);
  --shadow-lg: 0 16px 40px rgba(27, 34, 31, 0.14);
  --radius: 16px;
  --radius-sm: 10px;
  --tabbar-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --font: "Segoe UI", "SF Pro Display", "Helvetica Neue", ui-sans-serif, system-ui, sans-serif;
  --mono-num: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
}
html.dark {
  --bg: #101614;
  --bg-warm: #0C110F;
  --surface: #1A211E;
  --surface-2: #222A27;
  --text: #F1EEE6;
  --text-muted: #9AA59F;
  --border: #2C3531;
  --primary: #3CB892;
  --primary-hover: #54C9A4;
  --primary-soft: #16352C;
  --primary-ink: #8FE0C6;
  --expense: #E06B60;
  --expense-soft: #3A221F;
  --income: #4ECA86;
  --income-soft: #173226;
  --warn: #E0B15A;
  --warn-soft: #3A2F18;
  --danger: #E06B60;
  --overlay: rgba(0, 0, 0, 0.62);
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
html { background: var(--bg); }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  position: fixed;
  inset: 0;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
input, select, textarea {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  outline: none;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 25%, transparent);
}
textarea { resize: vertical; min-height: 72px; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

/* PIN */
#pin-screen {
  position: fixed; inset: 0; z-index: 80;
  background: var(--bg);
  display: flex; flex-direction: column; align-items: center;
  justify-content: space-between;
  padding: calc(48px + var(--safe-t)) 24px calc(28px + var(--safe-b));
}
#pin-screen[hidden] { display: none !important; }
.pin-brand { text-align: center; }
.logo-mark {
  width: 64px; height: 64px; margin: 0 auto 14px;
  background: var(--primary);
  color: #fff;
  border-radius: 18px;
  display: grid; place-items: center;
  font-weight: 700; font-size: 28px;
  box-shadow: 0 10px 24px color-mix(in srgb, var(--primary) 35%, transparent);
}
html.dark .logo-mark { color: #0C1A16; }
.pin-brand h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
.pin-brand .tag { color: var(--text-muted); margin-top: 4px; font-size: 15px; }
#pin-message { text-align: center; font-weight: 600; font-size: 17px; margin: 20px 0 16px; }
.pin-dots { display: flex; gap: 14px; justify-content: center; margin-bottom: 10px; }
.pin-dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--primary);
  transition: background 0.15s;
}
.pin-dot.filled { background: var(--primary); }
.pin-error { color: var(--danger); text-align: center; min-height: 20px; font-size: 14px; margin-top: 8px; }
.pin-pad {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  width: min(320px, 100%);
  margin: 12px auto 0;
}
.pin-key {
  height: 68px; border-radius: 50%;
  font-size: 26px; font-weight: 500;
  background: var(--surface);
  box-shadow: var(--shadow);
  display: grid; place-items: center;
  -webkit-user-select: none; user-select: none;
}
.pin-key:active { transform: scale(0.96); background: var(--primary-soft); }
.pin-key.ghost { background: transparent; box-shadow: none; font-size: 18px; color: var(--text-muted); }

/* App shell */
#app { height: 100%; display: flex; flex-direction: column; visibility: hidden; }
#app.ready { visibility: visible; }
#app-main {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: calc(12px + var(--safe-t)) 16px calc(var(--tabbar-h) + var(--safe-b) + 20px);
}
.view { display: none; animation: fadeUp 0.22s ease; }
.view.active { display: block; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

/* Headers */
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 16px; min-height: 36px;
}
.page-header h2 { font-size: 24px; letter-spacing: -0.03em; font-weight: 730; }
.page-kicker { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 600; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border);
}
.icon-btn:active { transform: scale(0.96); }
.header-actions { display: flex; gap: 8px; }

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  margin-bottom: 12px;
}
.stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
}
.stat .lbl { font-size: 12px; color: var(--text-muted); font-weight: 600; }
.stat .val { font-size: 20px; font-weight: 700; margin-top: 4px; letter-spacing: -0.03em; }
.stat.income .val { color: var(--income); }
.stat.expense .val { color: var(--expense); }
.balance-card {
  background: linear-gradient(145deg, #0E6B56 0%, #0A4F40 100%);
  color: #F4FFF9;
  border: none;
  padding: 18px;
  margin-bottom: 12px;
}
html.dark .balance-card { background: linear-gradient(145deg, #1B6B56 0%, #0E3D33 100%); }
.balance-card .lbl { opacity: 0.82; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; }
.balance-card .lbl.caps { text-transform: uppercase; }
.balance-card .val { font-size: 32px; font-weight: 750; letter-spacing: -0.04em; margin: 4px 0 0; }
.section-title {
  display: flex; align-items: center; justify-content: space-between;
  margin: 14px 4px 8px;
  font-size: 15px; font-weight: 700;
}
.section-title a, .section-title button.link {
  color: var(--primary-ink); font-size: 13px; font-weight: 650;
}

/* Progress */
.budget-row { margin-bottom: 14px; }
.budget-row:last-child { margin-bottom: 0; }
.budget-meta { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; gap: 8px; }
.budget-meta .name { font-weight: 650; }
.budget-meta .amt { color: var(--text-muted); }
.track {
  height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden;
  border: 1px solid var(--border);
}
.track > span {
  display: block; height: 100%; width: 0; border-radius: 99px;
  background: var(--primary); transition: width 0.4s ease;
}
.track.warn > span, .track > span.warn { background: var(--warn); }
.track.over > span, .track > span.over { background: var(--danger); }

/* Lists */
.txn-group { margin-bottom: 16px; }
.txn-day {
  font-size: 12px; font-weight: 700; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin: 0 4px 8px;
}
.txn-row, .list-row { cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 8px;
  width: 100%;
  text-align: left;
  box-shadow: var(--shadow);
}
.txn-row:active, .list-row:active { transform: scale(0.99); }
.cat-avatar {
  width: 42px; height: 42px; border-radius: 12px;
  display: grid; place-items: center;
  font-size: 20px; flex-shrink: 0;
}
.txn-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.txn-info .title { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txn-info .sub { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txn-amt { font-weight: 730; white-space: nowrap; }
.txn-amt.expense { color: var(--expense); }
.txn-amt.income { color: var(--income); }
.row-actions { display: flex; gap: 4px; flex-shrink: 0; }
.row-actions button {
  width: 34px; height: 34px; border-radius: 10px; color: var(--text-muted);
}
.row-actions button:active { background: var(--surface-2); }
.row-actions .del { color: var(--danger); }

.empty {
  text-align: center; color: var(--text-muted); padding: 28px 12px;
}
.empty .emoji { font-size: 36px; display: block; margin-bottom: 8px; }

/* Search / filters */
.search-row { display: flex; gap: 8px; margin-bottom: 12px; }
.search-row input { flex: 1; }
.filter-btn {
  padding: 0 14px; border-radius: var(--radius-sm);
  background: var(--surface); border: 1px solid var(--border);
  font-weight: 650; white-space: nowrap;
}
.filter-btn.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip {
  padding: 6px 10px; border-radius: 99px; font-size: 12px; font-weight: 650;
  background: var(--primary-soft); color: var(--primary-ink);
  display: inline-flex; align-items: center; gap: 6px;
}
.chip button { font-size: 14px; line-height: 1; }

/* Category grid */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.cat-cell {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 4px; border-radius: 14px;
  border: 2px solid transparent;
  background: var(--surface-2);
  font-size: 11px; font-weight: 650; text-align: center;
  color: var(--text);
  min-height: 66px;
}
.cat-cell .em { font-size: 22px; }
.cat-cell.selected { border-color: var(--primary); background: var(--primary-soft); }
.cat-cell .nm { line-height: 1.15; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Toggle */
.seg {
  display: grid; grid-template-columns: 1fr 1fr;
  background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px;
  margin-bottom: 14px;
}
.seg button {
  padding: 10px; border-radius: 10px; font-weight: 700;
  color: var(--text-muted);
}
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.seg.expense button.on { color: var(--expense); }
.seg.income button.on { color: var(--income); }

/* Forms */
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase; }
.amount-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 14px 10px;
  text-align: center;
  margin-bottom: 12px;
}
.amount-box .cur { color: var(--text-muted); font-weight: 650; font-size: 14px; }
.amount-box input {
  background: transparent; border: none; box-shadow: none;
  text-align: center; font-size: 36px; font-weight: 750;
  padding: 0; letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
}
.switch-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 8px 0;
}
.switch {
  --w: 48px; width: var(--w); height: 28px; border-radius: 99px;
  background: var(--border); position: relative; flex-shrink: 0;
  transition: background 0.2s;
}
.switch.on { background: var(--primary); }
.switch i {
  position: absolute; top: 3px; left: 3px;
  width: 22px; height: 22px; border-radius: 50%;
  background: #fff; transition: transform 0.2s;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.switch.on i { transform: translateX(20px); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 14px 16px; border-radius: 14px;
  font-weight: 730; font-size: 16px;
  background: var(--primary); color: #fff;
}
html.dark .btn { color: #0C1A16; }
.btn:active { transform: scale(0.99); background: var(--primary-hover); }
.btn.secondary {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border);
}
html.dark .btn.secondary { color: var(--text); }
.btn.danger { background: var(--danger); color: #fff; }
html.dark .btn.danger { color: #fff; }
.btn.ghost { background: transparent; color: var(--text-muted); }
.btn-row { display: flex; gap: 8px; margin-top: 8px; }
.btn-row .btn { flex: 1; }

/* Tab bar */
#tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  height: calc(var(--tabbar-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: grid; grid-template-columns: 1fr 1fr 72px 1fr 1fr;
  align-items: start;
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding-top: 8px; color: var(--text-muted); font-size: 10px; font-weight: 650;
}
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--primary-ink); }
.tab-add {
  position: relative; top: -16px;
  width: 58px; height: 58px; margin: 0 auto;
  border-radius: 50%;
  background: var(--primary); color: #fff;
  display: grid; place-items: center;
  box-shadow: 0 8px 20px color-mix(in srgb, var(--primary) 45%, transparent);
}
html.dark .tab-add { color: #0C1A16; }
.tab-add svg { width: 28px; height: 28px; }

/* More list */
.more-list { display: flex; flex-direction: column; gap: 8px; }
.more-item {
  display: flex; align-items: center; gap: 14px;
  padding: 16px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  width: 100%; text-align: left; box-shadow: var(--shadow);
}
.more-item .ico {
  width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center; font-size: 18px;
  background: var(--primary-soft);
}
.more-item .label { flex: 1; font-weight: 650; font-size: 16px; }
.more-item .chev { color: var(--text-muted); }

/* Settings rows */
.set-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 14px 0;
  border-bottom: 1px solid var(--border);
}
.set-row:last-child { border-bottom: none; }
.set-row .lbl { font-weight: 650; }
.set-row .hint { font-size: 12px; color: var(--text-muted); }
.set-row select { width: auto; min-width: 120px; padding: 8px 10px; }

/* Reports */
.legend { display: flex; gap: 14px; justify-content: center; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.compare .delta { font-weight: 730; font-size: 18px; }
.compare .up { color: var(--expense); }
.compare .down { color: var(--income); }
.breakdown-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.breakdown-row .bar-wrap { flex: 1; }
.chart-wrap { overflow: hidden; }

/* Sheets / modals */
#overlay {
  position: fixed; inset: 0; background: var(--overlay); z-index: 50;
  display: none;
}
#overlay.show { display: block; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  padding: 12px 16px calc(20px + var(--safe-b));
  max-height: 86vh; overflow-y: auto;
  transform: translateY(110%);
  transition: transform 0.28s ease;
  box-shadow: var(--shadow-lg);
}
.sheet.show { transform: translateY(0); }
.sheet-handle { width: 40px; height: 4px; border-radius: 4px; background: var(--border); margin: 4px auto 12px; }
.sheet h3 { margin-bottom: 14px; font-size: 18px; }
.modal {
  position: fixed; z-index: 70; left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(0.96);
  width: min(360px, calc(100% - 32px));
  background: var(--surface); border-radius: 18px;
  padding: 22px 18px 16px; box-shadow: var(--shadow-lg);
  display: none; opacity: 0; transition: opacity 0.2s, transform 0.2s;
}
.modal.show { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
.modal h3 { margin-bottom: 8px; }
.modal p { color: var(--text-muted); margin-bottom: 16px; white-space: pre-wrap; }
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + var(--safe-b) + 16px);
  transform: translateX(-50%) translateY(20px);
  background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 99px;
  font-size: 13px; font-weight: 650; z-index: 90;
  opacity: 0; pointer-events: none; transition: 0.25s;
  max-width: calc(100% - 32px); text-align: center;
}
html.dark .toast { background: #F1EEE6; color: #101614; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Full-screen subview chrome */
.back-title { display: flex; align-items: center; gap: 8px; }
.back-title h2 { font-size: 20px; }

/* Alert banner */
.alert-banner {
  background: var(--warn-soft); color: var(--warn);
  border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--border));
  border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 650;
  margin-bottom: 12px;
}
.alert-banner.over {
  background: var(--expense-soft); color: var(--expense);
  border-color: color-mix(in srgb, var(--expense) 35%, var(--border));
}

@media (min-width: 720px) {
  #app-main { max-width: 520px; margin: 0 auto; }
  #tabbar { max-width: 520px; left: 50%; transform: translateX(-50%); border-radius: 16px 16px 0 0; }
  .sheet { max-width: 520px; left: 50%; transform: translateX(-50%) translateY(110%); }
  .sheet.show { transform: translateX(-50%) translateY(0); }
}

/* Auth + cloud sync */
#auth-screen {
  position: fixed; inset: 0; z-index: 75;
  background: var(--bg);
  display: flex; flex-direction: column;
  padding: calc(16px + var(--safe-t)) 20px calc(24px + var(--safe-b));
  overflow-y: auto;
}
#auth-screen[hidden] { display: none !important; }
.auth-card { max-width: 420px; width: 100%; margin: 0 auto; }
.auth-card h2 { font-size: 24px; letter-spacing: -0.03em; margin: 8px 0 6px; }
.auth-card .lead { color: var(--text-muted); margin-bottom: 18px; }
.auth-error { color: var(--danger); font-size: 14px; min-height: 20px; margin: 0 0 10px; }
.btn.google {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border);
}
html.dark .btn.google { color: var(--text); }
.auth-links { text-align: center; margin-top: 14px; }
.auth-links button { color: var(--primary-ink); font-weight: 650; padding: 6px; }
#sync-chip {
  position: fixed; top: calc(8px + var(--safe-t)); right: 12px; z-index: 35;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 99px; padding: 4px 10px;
  font-size: 11px; font-weight: 700; color: var(--text-muted);
  box-shadow: var(--shadow); max-width: 60%;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#sync-chip[hidden] { display: none !important; }
#sync-chip.syncing { color: var(--primary-ink); }
#sync-chip.synced { color: var(--income); }
#sync-chip.offline, #sync-chip.error { color: var(--warn); }
.cloud-banner {
  background: var(--primary-soft); color: var(--primary-ink);

<body>
  <div id="pin-screen">
    <div class="pin-brand">
      <div class="logo-mark">ح</div>
      <h1>Hisab</h1>
      <div class="tag">Expense manager</div>
    </div>
    <div>
      <div id="pin-message">Create a 4-digit PIN</div>
      <div class="pin-dots" id="pin-dots">
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
      </div>
      <div class="pin-error" id="pin-error"></div>
    </div>
    <div class="pin-pad" id="pin-pad"></div>
  </div>


  <div id="auth-screen" hidden>
    <div class="auth-card">
      <button type="button" class="icon-btn" data-act="auth-close" aria-label="Close">←</button>
      <h2 id="auth-title">Sign in</h2>
      <p class="lead" id="auth-lead">Sync your expenses across devices.</p>
      <div class="field" id="auth-email-wrap"><label>Email</label><input id="auth-email" type="email" autocomplete="username" placeholder="you@example.com"></div>
      <div class="field" id="auth-pass-wrap"><label>Password</label><input id="auth-pass" type="password" autocomplete="current-password" placeholder="At least 6 characters"></div>
      <div class="field" id="auth-pass2-wrap" hidden><label>Confirm password</label><input id="auth-pass2" type="password" autocomplete="new-password"></div>
      <p class="auth-error" id="auth-error"></p>
      <button type="button" class="btn" id="auth-submit" data-act="auth-submit">Sign in</button>
      <button type="button" class="btn google" id="auth-google" data-act="auth-google" style="margin-top:8px">Continue with Google</button>
      <div class="auth-links">
        <button type="button" id="auth-goto-signup" data-act="auth-mode" data-mode="signup">Create an account</button>
        <button type="button" id="auth-goto-forgot" data-act="auth-mode" data-mode="forgot">Forgot password</button>
        <button type="button" id="auth-goto-login" data-act="auth-mode" data-mode="login" hidden>Back to sign in</button>
      </div>
    </div>
  </div>
  <div id="sync-chip" hidden></div>
  <div id="app">
    <main id="app-main"></main>
    <nav id="tabbar">

        Home
      </button>
      <button class="tab" data-tab="transactions" aria-label="Transactions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7h12M8 12h12M8 17h12"/><path d="M4 7h.01M4 12h.01M4 17h.01"/></svg>
        Txns

        Reports

  <div id="overlay"></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  <div id="modal" class="modal" role="dialog" aria-modal="true"></div>

  <script src="firebase-config.js"></script>
  <script src="vendor/firebase.js"></script>
  <script src="js/cloud.js"></script>
  <script>
(function () {
  'use strict';

  const STORAGE_KEY = 'hisab-v1';
  const PAYMENT_METHODS = ['Cash', 'Card', 'JazzCash', 'Easypaisa', 'Bank'];
  const ACCOUNT_TYPES = ['cash', 'bank', 'wallet'];
  const FREQUENCIES = ['daily', 'weekly', 'monthly', 'yearly'];
  const CURRENCIES = {
    PKR: { symbol: 'Rs', space: true },
    USD: { symbol: '$', space: false },
    EUR: { symbol: '€', space: false },
    GBP: { symbol: '£', space: false },
    AED: { symbol: 'AED', space: true },
    INR: { symbol: '₹', space: false },
    SAR: { symbol: 'SAR', space: true }
  };
  const PRESET_ICONS = ['🍽️','🏠','🚗','💡','🛍️','💊','🎬','📦','💰','💻','💵','🚌','⛽','🎓','✈️','📱','🧾','🎁','☕','🏋️','🧾','🧼','🐾','🎵','📚'];
  const DEFAULT_CATEGORY_DEFS = [
    { name: 'Food', type: 'expense', icon: '🍽️', color: '#E07A3D' },
    { name: 'Rent', type: 'expense', icon: '🏠', color: '#5B7CFA' },
    { name: 'Transport', type: 'expense', icon: '🚗', color: '#3D9BE0' },
    { name: 'Bills', type: 'expense', icon: '💡', color: '#E0B03D' },
    { name: 'Shopping', type: 'expense', icon: '🛍️', color: '#C45BB0' },
    { name: 'Health', type: 'expense', icon: '💊', color: '#E05B6A' },
    { name: 'Entertainment', type: 'expense', icon: '🎬', color: '#7B61E0' },
    { name: 'Other', type: 'expense', icon: '📦', color: '#7A847E' },
    { name: 'Salary', type: 'income', icon: '💰', color: '#1B7A4A' },
    { name: 'Freelance', type: 'income', icon: '💻', color: '#0E6B56' },
    { name: 'Other', type: 'income', icon: '💵', color: '#4A9B6A' }
  ];
  const DEFAULT_ACCOUNT_DEFS = [
    { name: 'Cash', type: 'cash', opening_balance: 0 },
    { name: 'Bank', type: 'bank', opening_balance: 0 },
    { name: 'JazzCash', type: 'wallet', opening_balance: 0 }
  ];

  const SHA_K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];

  function sha256Hex(input) {
    function rotr(n, x) { return (x >>> n) | (x << (32 - n)); }
    const bytes = typeof input === 'string' ? new TextEncoder().encode(input) : input;
    const l = bytes.length;
    const bitLenHi = Math.floor(l / 0x20000000);
    const bitLenLo = (l * 8) >>> 0;
    const rem = l % 64;
    const padLen = rem < 56 ? 64 - rem : 128 - rem;
    const packed = new Uint8Array(l + padLen);
    packed.set(bytes);
    packed[l] = 0x80;
    const dv = new DataView(packed.buffer);
    dv.setUint32(packed.length - 8, bitLenHi, false);
    dv.setUint32(packed.length - 4, bitLenLo, false);
    const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    const W = new Uint32Array(64);
    for (let off = 0; off < packed.length; off += 64) {
      for (let i = 0; i < 16; i++) W[i] = dv.getUint32(off + i * 4, false);
      for (let i = 16; i < 64; i++) {
        const s0 = rotr(7, W[i - 15]) ^ rotr(18, W[i - 15]) ^ (W[i - 15] >>> 3);
        const s1 = rotr(17, W[i - 2]) ^ rotr(19, W[i - 2]) ^ (W[i - 2] >>> 10);
        W[i] = (W[i - 16] + s0 + W[i - 7] + s1) >>> 0;
      }
      let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (let i = 0; i < 64; i++) {
        const S1 = rotr(6, e) ^ rotr(11, e) ^ rotr(25, e);
        const ch = (e & f) ^ (~e & g);
        const temp1 = (h + S1 + ch + SHA_K[i] + W[i]) >>> 0;
        const S0 = rotr(2, a) ^ rotr(13, a) ^ rotr(22, a);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const temp2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + temp1) >>> 0;
        d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
      }
      H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0;
      H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
      H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0;
      H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
    }
    return H.map(function (x) { return x.toString(16).padStart(8, '0'); }).join('');
  }

  async function hashPin(pin) {
    const payload = 'hisab-v1-pin:' + pin;
    try {
      if (globalThis.isSecureContext && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(payload));
        return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      }
    } catch (err) { /* fallback below */ }
    return sha256Hex(payload);
  }

  function uid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  function toDateStr(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function todayStr() { return toDateStr(new Date()); }

  function yearMonth(d) {
    if (typeof d === 'string') return d.slice(0, 7);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
  }

  function parseDate(str) {
    const p = (str || '').split('-').map(Number);
    return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
  }

  function addFrequency(dateStr, frequency) {
    const d = parseDate(dateStr);
    if (frequency === 'daily') d.setDate(d.getDate() + 1);
    else if (frequency === 'weekly') d.setDate(d.getDate() + 7);
    else if (frequency === 'yearly') d.setFullYear(d.getFullYear() + 1);
    else {
      const day = d.getDate();
      d.setMonth(d.getMonth() + 1);
      if (d.getDate() < day) d.setDate(0);
    }
    return toDateStr(d);
  }

  function monthLabel(ym, long) {
    const d = parseDate(ym + '-01');
    return d.toLocaleDateString('en-PK', { month: long ? 'long' : 'short', year: 'numeric' });
  }

  function shortMonth(ym) {
    return parseDate(ym + '-01').toLocaleDateString('en-PK', { month: 'short' });
  }

  function niceDate(dateStr) {
    const t = todayStr();
    const y = toDateStr(new Date(Date.now() - 86400000));
    if (dateStr === t) return 'Today';
    if (dateStr === y) return 'Yesterday';
    return parseDate(dateStr).toLocaleDateString('en-PK', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  }

  function lastNMonths(n) {
    const out = [];
    const now = new Date();
    const base = new Date(now.getFullYear(), now.getMonth(), 1);
    for (let i = n - 1; i >= 0; i--) {
      const x = new Date(base.getFullYear(), base.getMonth() - i, 1);
      out.push(yearMonth(x));
    }
    return out;
  }

  function parseAmountToPaisa(str) {
    const cleaned = String(str || '').replace(/,/g, '').trim();
    if (!cleaned || cleaned === '.') return 0;
    const neg = cleaned.charAt(0) === '-';
    const raw = cleaned.replace(/-/g, '');
    const parts = raw.split('.');
    const whole = parseInt(parts[0] || '0', 10) || 0;
    const frac = ((parts[1] || '') + '00').slice(0, 2);
    const paisa = whole * 100 + parseInt(frac, 10);
    return neg ? -paisa : paisa;
  }

  function paisaToInput(paisa) {
    const neg = paisa < 0;
    const abs = Math.abs(paisa);
    const whole = Math.floor(abs / 100);
    const frac = abs % 100;
    const body = frac ? whole + '.' + pad2(frac) : String(whole);
    return neg ? '-' + body : body;
  }

  function formatMoney(paisa) {
    const cur = CURRENCIES[state.currency] || CURRENCIES.PKR;
    const neg = paisa < 0;
    const abs = Math.abs(Number(paisa) || 0);
    const rupees = abs / 100;
    const hasDec = (abs % 100) !== 0;
    const formatted = rupees.toLocaleString('en-PK', {
      minimumFractionDigits: hasDec ? 2 : 0,
      maximumFractionDigits: 2
    });
    const body = cur.space ? cur.symbol + ' ' + formatted : cur.symbol + formatted;
    return neg ? '-' + body : body;
  }

  function formatAxis(paisa) {
    const r = Math.abs(paisa) / 100;
    if (r >= 100000) return (r / 100000).toFixed(1).replace(/\.0$/, '') + 'L';
    if (r >= 1000) return (r / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    return String(Math.round(r));
  }

  function softColor(hex) {
    const h = (hex || '#7A847E').replace('#', '');
    if (h.length !== 6) return 'var(--surface-2)';
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    const dark = document.documentElement.classList.contains('dark');
    return dark ? 'rgba(' + r + ',' + g + ',' + b + ',0.28)' : 'rgba(' + r + ',' + g + ',' + b + ',0.18)';
  }

  /* ---------- state ---------- */
  let state = null;
  const ui = {
    view: 'home',
    tab: 'home',
    returnView: 'home',
    unlocked: false,
    pinBuffer: '',
    pinMode: 'set',
    pinPending: '',
    form: null,
    ruleForm: null,
    filters: { search: '', dateFrom: '', dateTo: '', categoryId: '', accountId: '', type: '' },
    alertQueue: []
  };

  try {
    const preview = localStorage.getItem(STORAGE_KEY);
    if (preview && JSON.parse(preview).darkMode) document.documentElement.classList.add('dark');
  } catch (e) { /* ignore corrupt preview */ }

  function seedDefaults() {
    var data = {
      version: 1,
      pinHash: null,
      pinEnabled: true,
      currency: 'PKR',
      darkMode: false,
      accounts: DEFAULT_ACCOUNT_DEFS.map(function (a) {
        return { id: uid(), name: a.name, type: a.type, opening_balance: a.opening_balance };
      }),
      categories: DEFAULT_CATEGORY_DEFS.map(function (c) {
        return { id: uid(), name: c.name, type: c.type, icon: c.icon, color: c.color, is_default: true };
      }),
      transactions: [],
      budgets: [],
      recurring_rules: [],
      alertLog: {}
    };
    ['accounts','categories','transactions','budgets','recurring_rules'].forEach(function (n) {
      migrateCollection(data[n]);
    });
    return data;
  }

  function migrateCollection(list) {
    var now = Date.now();
    (list || []).forEach(function (item) {
      if (!item) return;
      if (!item.updated_at) item.updated_at = now;
      if (item.deleted == null) item.deleted = false;
    });
    return list || [];
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return seedDefaults();
      const data = JSON.parse(raw);
      if (!data || typeof data !== 'object') return seedDefaults();
      data.accounts = migrateCollection(data.accounts || []);
      data.categories = migrateCollection(data.categories || []);
      data.transactions = migrateCollection(data.transactions || []);
      data.budgets = migrateCollection(data.budgets || []);
      data.recurring_rules = migrateCollection(data.recurring_rules || []);
      data.alertLog = data.alertLog || {};
      if (!data.currency) data.currency = 'PKR';
      if (data.pinEnabled == null) data.pinEnabled = true;
      return data;
    } catch (e) {
      return seedDefaults();
    }
  }

  function saveState(opts) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (!(opts && opts.skipSync) && window.HisabCloud && HisabCloud.schedulePush) {
      HisabCloud.schedulePush();
    }
  }

  function touch(item, deleted) {
    if (!item) return item;
    item.updated_at = Date.now();
    item.deleted = deleted == null ? !!item.deleted : !!deleted;
    return item;
  }

  function active(list) {
    return (list || []).filter(function (x) { return x && !x.deleted; });
  }

  function softDeleteById(list, id) {
    var found = null;
    (list || []).forEach(function (item) {
      if (item && item.id === id) { touch(item, true); found = item; }
    });
    return found;
  }

  function applyTheme() {
    document.documentElement.classList.toggle('dark', !!state.darkMode);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', state.darkMode ? '#101614' : '#0E6B56');
  }

  function getCategory(id) { return state.categories.find(function (c) { return c.id === id; }); }
  function getAccount(id) { return state.accounts.find(function (a) { return a.id === id; }); }

  function accountBalance(account) {
    let bal = account.opening_balance || 0;
    for (let i = 0; i < state.transactions.length; i++) {
      const t = state.transactions[i];
      if (t.deleted || t.account_id !== account.id) continue;
      bal += t.type === 'income' ? t.amount : -t.amount;
    }
    return bal;
  }

  function totalBalance() {
    return active(state.accounts).reduce(function (s, a) { return s + accountBalance(a); }, 0);
  }

  function txnsInMonth(ym, list) {
    list = list || state.transactions;
    return list.filter(function (t) { return t && !t.deleted && t.date && t.date.startsWith(ym); });
  }

  function monthTotals(ym) {
    let income = 0, expense = 0;
    const list = txnsInMonth(ym);
    for (let i = 0; i < list.length; i++) {
      if (list[i].type === 'income') income += list[i].amount;
      else expense += list[i].amount;
    }
    return { income: income, expense: expense, net: income - expense };
  }

  function categorySpend(ym, categoryId) {
    return txnsInMonth(ym).reduce(function (s, t) {
      if (t.type !== 'expense') return s;
      if (categoryId && t.category_id !== categoryId) return s;
      return s + t.amount;
    }, 0);
  }

  function budgetProgress(budget) {
    const spent = budget.category_id
      ? categorySpend(budget.month, budget.category_id)
      : categorySpend(budget.month, null);
    const pct = budget.amount > 0 ? (spent / budget.amount) * 100 : 0;
    const over = spent > budget.amount;
    const warn = !over && pct >= (budget.alert_threshold || 80);
    return { spent: spent, pct: pct, over: over, warn: warn };
  }

  function processRecurring() {
    const today = todayStr();
    let created = 0;
    let dirty = false;
    state.recurring_rules.forEach(function (rule) {
      if (!rule.is_active || rule.deleted) return;
      let guard = 0;
      while (rule.next_run_date && rule.next_run_date <= today && guard++ < 400) {
        if (rule.end_date && rule.next_run_date > rule.end_date) {
          rule.is_active = false;
          touch(rule);
          dirty = true;
          break;
        }
        state.transactions.push(touch({
          id: uid(),
          account_id: rule.account_id,
          category_id: rule.category_id,
          type: rule.type,
          amount: rule.amount,
          date: rule.next_run_date,
          note: rule.note || '',
          payment_method: rule.payment_method || 'Cash',
          recurring_id: rule.id,
          created_at: new Date().toISOString(),
          deleted: false
        }));
        created += 1;
        rule.next_run_date = addFrequency(rule.next_run_date, rule.frequency);
        touch(rule);
        if (rule.end_date && rule.next_run_date > rule.end_date) {
          rule.is_active = false;
          touch(rule);
          dirty = true;
          break;
        }
      }
    });
    if (created || dirty) saveState();
    return created;
  }

  function collectBudgetAlerts(ym) {
    const alerts = [];
    state.budgets.filter(function (b) { return !b.deleted && b.month === ym; }).forEach(function (b) {
      const p = budgetProgress(b);
      const cat = b.category_id ? (getCategory(b.category_id) || { name: 'Category' }) : { name: 'Overall' };
      const overKey = b.id + ':' + ym + ':over';
      const warnKey = b.id + ':' + ym + ':threshold';
      if (p.over && !state.alertLog[overKey]) {
        alerts.push({
          key: overKey,
          over: true,
          text: 'You have exceeded your ' + cat.name + ' budget for ' + monthLabel(ym, true) + ' (' + formatMoney(p.spent) + ' of ' + formatMoney(b.amount) + ').'
        });
      } else if (p.warn && !state.alertLog[warnKey]) {
        alerts.push({
          key: warnKey,
          over: false,
          text: 'You have used ' + Math.round(p.pct) + '% of your ' + cat.name + ' budget for ' + monthLabel(ym, true) + '.'
        });
      }
    });
    return alerts;
  }

  /* ---------- charts ---------- */
  function donutChart(items) {
    const total = items.reduce(function (s, i) { return s + i.value; }, 0);
    if (!total) {
      return '<div class="empty"><span class="emoji">📊</span>No expenses this month</div>';
    }
    const cx = 80, cy = 80, r = 54, sw = 18;
    const circ = 2 * Math.PI * r;
    let offset = 0;
    const circles = items.map(function (it) {
      const len = (it.value / total) * circ;
      const el = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + escapeHtml(it.color) + '" stroke-width="' + sw + '" stroke-dasharray="' + len + ' ' + (circ - len) + '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
      offset += len;
      return el;
    }).join('');
    const legend = items.map(function (it) {
      return '<div class="breakdown-row"><span class="cat-avatar" style="width:28px;height:28px;font-size:14px;background:' + softColor(it.color) + '">' + (it.icon || '') + '</span><div class="bar-wrap"><div class="budget-meta"><span class="name">' + escapeHtml(it.label) + '</span><span class="amt num">' + escapeHtml(formatMoney(it.value)) + '</span></div><div class="track"><span style="width:' + (it.value / total * 100) + '%;background:' + escapeHtml(it.color) + '"></span></div></div></div>';
    }).join('');
    return '<div class="chart-wrap" style="max-width:190px;margin:0 auto 4px"><svg viewBox="0 0 160 160" width="100%" height="150" role="img" aria-label="Spending by category">' + circles + '<text x="80" y="76" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.7">Spent</text><text x="80" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">' + escapeHtml(formatMoney(total)) + '</text></svg></div>' + legend;
  }

  function barChart(rows) {
    const w = 360, h = 190, padL = 38, padR = 8, padT = 14, padB = 30;
    const max = Math.max(1, ...rows.flatMap(function (r) { return [r.income, r.expense]; }));
    const groupW = (w - padL - padR) / rows.length;
    const innerH = h - padT - padB;
    const ticks = 4;
    let grid = '';
    for (let i = 0; i <= ticks; i++) {
      const y = padT + innerH - (innerH * i / ticks);
      const val = Math.round(max * i / ticks);
      grid += '<line x1="' + padL + '" y1="' + y + '" x2="' + w + '" y2="' + y + '" stroke="currentColor" opacity="0.12"/>';
      grid += '<text x="' + (padL - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="9" fill="currentColor" opacity="0.6">' + escapeHtml(formatAxis(val)) + '</text>';
    }
    const bars = rows.map(function (r, idx) {
      const x0 = padL + idx * groupW;
      const bw = Math.max(8, groupW * 0.28);
      const gap = 4;
      const ih = (r.income / max) * innerH;
      const eh = (r.expense / max) * innerH;
      const ix = x0 + groupW / 2 - bw - gap / 2;
      const ex = x0 + groupW / 2 + gap / 2;
      const iy = padT + innerH - ih;
      const ey = padT + innerH - eh;
      return '<rect x="' + ix + '" y="' + iy + '" width="' + bw + '" height="' + Math.max(ih, 0) + '" rx="3" fill="#1B7A4A"><title>Income ' + escapeHtml(formatMoney(r.income)) + '</title></rect>' +
        '<rect x="' + ex + '" y="' + ey + '" width="' + bw + '" height="' + Math.max(eh, 0) + '" rx="3" fill="#C4473A"><title>Expenses ' + escapeHtml(formatMoney(r.expense)) + '</title></rect>' +
        '<text x="' + (x0 + groupW / 2) + '" y="' + (h - 10) + '" text-anchor="middle" font-size="10" fill="currentColor" opacity="0.75">' + escapeHtml(r.label) + '</text>';
    }).join('');
    return '<div class="chart-wrap"><svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="200" role="img" aria-label="Monthly trend">' + grid + bars + '</svg></div>' +
      '<div class="legend"><span><i style="background:#1B7A4A"></i>Income</span><span><i style="background:#C4473A"></i>Expenses</span></div>';
  }

  /* ---------- PIN ---------- */
  function renderPinDots() {
    const dots = document.querySelectorAll('#pin-dots .pin-dot');
    dots.forEach(function (d, i) { d.classList.toggle('filled', i < ui.pinBuffer.length); });
  }

  function setPinMessage(text, err) {
    document.getElementById('pin-message').textContent = text;
    const e = document.getElementById('pin-error');
    e.textContent = err || '';
  }

  function buildPinPad() {
    const pad = document.getElementById('pin-pad');
    const keys = ['1','2','3','4','5','6','7','8','9','C','0','⌫'];
    pad.innerHTML = keys.map(function (k) {
      const ghost = (k === 'C' || k === '⌫') ? ' ghost' : '';
      return '<button type="button" class="pin-key' + ghost + '" data-act="pin-key" data-key="' + k + '" aria-label="Key ' + k + '">' + k + '</button>';
    }).join('');
  }

  async function handlePinKey(key) {
    document.getElementById('pin-error').textContent = '';
    if (key === 'C') { ui.pinBuffer = ''; renderPinDots(); return; }
    if (key === '⌫') { ui.pinBuffer = ui.pinBuffer.slice(0, -1); renderPinDots(); return; }
    if (!/^\d$/.test(key) || ui.pinBuffer.length >= 4) return;
    ui.pinBuffer += key;
    renderPinDots();
    if (ui.pinBuffer.length === 4) {
      const entered = ui.pinBuffer;
      ui.pinBuffer = '';
      setTimeout(function () { processPin(entered); }, 80);
    }
  }

  async function processPin(pin) {
    const mode = ui.pinMode;
    if (mode === 'set' || mode === 'change-new' || mode === 'enable') {
      ui.pinPending = pin;
      ui.pinMode = mode === 'set' ? 'confirm' : mode === 'enable' ? 'enable-confirm' : 'change-confirm';
      renderPinDots();
      setPinMessage('Confirm your PIN');
      return;
    }
    if (mode === 'confirm' || mode === 'change-confirm' || mode === 'enable-confirm') {
      if (pin !== ui.pinPending) {
        setPinMessage('Confirm your PIN', 'PINs did not match. Try again.');
        ui.pinPending = '';
        ui.pinMode = mode === 'confirm' ? 'set' : mode === 'enable-confirm' ? 'enable' : 'change-new';
        renderPinDots();
        setTimeout(function () {
          if (ui.pinMode === 'set') setPinMessage('Create a 4-digit PIN');
          else if (ui.pinMode === 'enable') setPinMessage('Choose a new 4-digit PIN');
          else setPinMessage('Enter a new 4-digit PIN');
        }, 900);
        return;
      }
      state.pinHash = await hashPin(pin);
      state.pinEnabled = true;
      saveState();
      if (mode === 'confirm') {
        enterApp();
        toast('PIN saved');
      } else {
        hidePin();
        ui.view = 'settings';
        render();
        toast('PIN updated');
      }
      return;
    }
    if (mode === 'unlock' || mode === 'change-old' || mode === 'disable') {
      const hashed = await hashPin(pin);
      if (hashed !== state.pinHash) {
        renderPinDots();
        setPinMessage(mode === 'unlock' ? 'Enter your PIN' : 'Enter your current PIN', 'Incorrect PIN');
        return;
      }
      if (mode === 'unlock') { enterApp(); return; }
      if (mode === 'disable') {
        state.pinEnabled = false;
        state.pinHash = null;
        saveState();
        hidePin();
        ui.view = 'settings';
        render();
        toast('PIN lock turned off');
        return;
      }
      ui.pinMode = 'change-new';
      renderPinDots();
      setPinMessage('Enter a new 4-digit PIN');
    }
  }

  function showPin(mode, message) {
    ui.pinMode = mode;
    ui.pinBuffer = '';
    ui.pinPending = '';
    renderPinDots();
    setPinMessage(message);
    document.getElementById('pin-screen').hidden = false;
  }

  function hidePin() {
    document.getElementById('pin-screen').hidden = true;
  }

  function filteredTransactions() {
    const f = ui.filters;
    const q = (f.search || '').trim().toLowerCase();
    return state.transactions.filter(function (t) {
      if (!t || t.deleted) return false;
      if (f.type && t.type !== f.type) return false;
      if (f.categoryId && t.category_id !== f.categoryId) return false;
      if (f.accountId && t.account_id !== f.accountId) return false;
      if (f.dateFrom && t.date < f.dateFrom) return false;
      if (f.dateTo && t.date > f.dateTo) return false;
      if (q) {
        const cat = getCategory(t.category_id);
        const acc = getAccount(t.account_id);
        const hay = [t.note, t.payment_method, cat && cat.name, acc && acc.name, paisaToInput(t.amount), formatMoney(t.amount)].join(' ').toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    }).slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.created_at || '').localeCompare(a.created_at || '');
    });
  }

  function activeFilterCount() {
    const f = ui.filters;
    let n = 0;
    if (f.dateFrom) n++;
    if (f.dateTo) n++;
    if (f.categoryId) n++;
    if (f.accountId) n++;
    if (f.type) n++;

      .map(function (b) { return { b: b, p: budgetProgress(b) }; });

    const alerts = budgets.filter(function (x) { return x.p.over || x.p.warn; });
    const byCat = {};
    txnsInMonth(ym).forEach(function (t) {
      if (t.type !== 'expense') return;
      const id = t.category_id || '_';
      if (!byCat[id]) {
        const c = getCategory(t.category_id);

  function renderReports() {
    const months = lastNMonths(6);
    const rows = months.map(function (ym) {
      const t = monthTotals(ym);
      return { label: shortMonth(ym), income: t.income, expense: t.expense, ym: ym };
    });
    const thisYm = yearMonth(new Date());
    const prevDate = new Date(); prevDate.setMonth(prevDate.getMonth() - 1);
    const prevYm = yearMonth(prevDate);
    const cur = monthTotals(thisYm);
    const prev = monthTotals(prevYm);
    function deltaHtml(now, then, invert) {
      if (then === 0 && now === 0) return '<div class="delta">—</div><div class="hint">No data last month</div>';
      if (then === 0) return '<div class="delta up">New</div><div class="hint">No data last month</div>';
      const pct = ((now - then) / then) * 100;
      const more = pct > 0.5;
      const less = pct < -0.5;
      const cls = invert ? (more ? 'up' : less ? 'down' : '') : (more ? 'down' : less ? 'up' : '');
      const label = more ? Math.abs(pct).toFixed(0) + '% more' : less ? Math.abs(pct).toFixed(0) + '% less' : 'No change';
      return '<div class="delta ' + cls + '">' + label + '</div><div class="hint">vs ' + escapeHtml(monthLabel(prevYm, false)) + '</div>';
    }
    const byCat = {};
    txnsInMonth(thisYm).forEach(function (t) {
      if (t.type !== 'expense') return;
      const id = t.category_id || '_';
      if (!byCat[id]) {
        const c = getCategory(t.category_id);
        byCat[id] = { label: c ? c.name : 'Other', icon: c ? c.icon : '📦', color: c ? c.color : '#7A847E', value: 0 };
      }
      byCat[id].value += t.amount;
    });
    const slices = Object.keys(byCat).map(function (k) { return byCat[k]; }).sort(function (a, b) { return b.value - a.value; });
    return '<div class="page-header"><h2>Reports</h2></div>' +
      '<div class="section-title">Last 6 months</div><div class="card" data-testid="reports-trend">' + barChart(rows) + '</div>' +
      '<div class="section-title">Vs last month</div><div class="compare"><div class="card"><div class="lbl">Expenses</div>' + deltaHtml(cur.expense, prev.expense, true) + '<div class="num" style="margin-top:8px;font-weight:700">' + escapeHtml(formatMoney(cur.expense)) + '</div></div><div class="card"><div class="lbl">Income</div>' + deltaHtml(cur.income, prev.income, false) + '<div class="num" style="margin-top:8px;font-weight:700">' + escapeHtml(formatMoney(cur.income)) + '</div></div></div>' +
      '<div class="section-title">Category breakdown · ' + escapeHtml(shortMonth(thisYm)) + '</div><div class="card">' + donutChart(slices) + '</div>';
  }

  function render() {
    const main = document.getElementById('app-main');
    const active = document.activeElement;
    const aid = active && active.id;
    const start = active && active.selectionStart;
    const end = active && active.selectionEnd;
    const fn = VIEW_RENDERERS[ui.view] || renderHome;
    main.innerHTML = fn();
    const tabFor = (ui.view === 'add') ? ui.tab : (['home','transactions','reports','more'].indexOf(ui.view) >= 0 ? ui.view : 'more');
    document.querySelectorAll('#tabbar .tab').forEach(function (el) {
      el.classList.toggle('on', el.getAttribute('data-tab') === tabFor);
    });
    if (aid) {
      const el = document.getElementById(aid);
      if (el) {
        el.focus();
        try { if (start != null) el.setSelectionRange(start, end); } catch (e) { /* not a text field */ }
      }
    }
  }

      '<div class="field"><label>Start / next date</label><input id="r-next" type="date" value="' + escapeHtml(r.next_run_date || r.start_date || todayStr()) + '"></div>' +
      '<div class="field"><label>End date (optional)</label><input id="r-end" type="date" value="' + escapeHtml(r.end_date || '') + '"></div>' +
      '<div class="field"><label>Payment method</label><select id="r-pay">' + PAYMENT_METHODS.map(function (p) { return '<option' + (r.payment_method === p ? ' selected' : '') + '>' + p + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label>Note</label><input id="r-note" value="' + escapeHtml(r.note || '') + '"></div>' +
