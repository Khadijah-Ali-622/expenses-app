  function refreshRuleSheetCats(type) {
    const sheet = document.getElementById('sheet');
    sheet._ruleType = type;
    const sel = document.getElementById('r-cat');
    if (!sel) return;
    const cur = sel.value;
    const cats = active(state.categories).filter(function (c) { return c.type === type; });
    sel.innerHTML = cats.map(function (c) {
      return '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>';
    }).join('');
    if (cats.some(function (c) { return c.id === cur; })) sel.value = cur;
    const seg = sheet.querySelector('.seg');
    if (seg) {
      seg.className = 'seg ' + type;
      seg.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-type') === type); });
    }
  }

  /* ---------- save handlers ---------- */
  async function saveTransaction() {
    readAddFormIntoUi();
    const f = ui.form;
    const amount = parseAmountToPaisa(f.amount);
    if (amount <= 0) { toast('Enter an amount greater than 0'); return; }
    if (!f.category_id) { toast('Pick a category'); return; }
    if (!f.account_id) { toast('Pick an account'); return; }
    if (!f.date) { toast('Pick a date'); return; }
    const payload = {
      account_id: f.account_id,
      category_id: f.category_id,
      type: f.type,
      amount: amount,
      date: f.date,
      note: (f.note || '').trim(),
      payment_method: f.payment_method || 'Cash'
    };
    if (f.id) {
      const t = state.transactions.find(function (x) { return x.id === f.id; });
      if (!t) { toast('Transaction not found'); return; }
      Object.assign(t, payload);
      touch(t, false);
      saveState();
      toast('Transaction updated');
    } else {
      let recurringId = null;
      if (f.makeRecurring) {
        const rule = touch({
          id: uid(),
          account_id: payload.account_id,
          category_id: payload.category_id,
          type: payload.type,
          amount: payload.amount,
          note: payload.note,
          frequency: f.frequency || 'monthly',
          start_date: payload.date,
          next_run_date: addFrequency(payload.date, f.frequency || 'monthly'),
          end_date: null,
          is_active: true,
          payment_method: payload.payment_method,
          deleted: false
        });
        state.recurring_rules.push(rule);
        recurringId = rule.id;
      }
      state.transactions.push(touch(Object.assign({
        id: uid(),
        recurring_id: recurringId,
        created_at: new Date().toISOString(),
        deleted: false
      }, payload)));
      saveState();
      toast('Transaction saved');
    }
    const back = ui.returnView || 'home';
    goto(back, ['home','transactions','reports','more'].indexOf(back) >= 0 ? back : ui.tab);
    showBudgetAlerts(yearMonth(payload.date));
  }

  async function deleteTransaction(id) {
    const ok = await confirmDlg('Delete transaction?', 'This cannot be undone.', 'Delete', true);
    if (!ok) return;
    const ym = (state.transactions.find(function (t) { return t.id === id; }) || {}).date;
    softDeleteById(state.transactions, id);
    saveState();
    toast('Deleted');
    if (ui.view === 'add') goto(ui.returnView || 'transactions');
    else render();
    if (ym) showBudgetAlerts(yearMonth(ym));
  }

  function saveBudget(id) {
    const month = (document.getElementById('b-month') || {}).value;
    const category_id = (document.getElementById('b-cat') || {}).value || null;
    const amount = parseAmountToPaisa((document.getElementById('b-amt') || {}).value);
    const threshold = Math.min(100, Math.max(1, parseInt((document.getElementById('b-th') || {}).value, 10) || 80));
    if (!month) { toast('Pick a month'); return; }
    if (amount <= 0) { toast('Enter a budget amount'); return; }
    const dup = state.budgets.find(function (b) {
      return !b.deleted && b.id !== id && b.month === month && (b.category_id || null) === category_id;
    });
    if (dup) { toast('A budget for this category and month already exists'); return; }
    if (id) {
      const b = state.budgets.find(function (x) { return x.id === id; });
      if (!b) return;
      b.month = month; b.category_id = category_id; b.amount = amount; b.alert_threshold = threshold;
      touch(b, false);
      delete state.alertLog[b.id + ':' + month + ':over'];
      delete state.alertLog[b.id + ':' + month + ':threshold'];
    } else {
      state.budgets.push(touch({ id: uid(), category_id: category_id, amount: amount, month: month, alert_threshold: threshold, deleted: false }));
    }
    saveState();
    closeSheet();
    render();
    toast('Budget saved');
    showBudgetAlerts(month);
  }

  function saveAccount(id) {
    const name = ((document.getElementById('a-name') || {}).value || '').trim();
    const type = (document.getElementById('a-type') || {}).value || 'bank';
    const opening = parseAmountToPaisa((document.getElementById('a-open') || {}).value);
    if (!name) { toast('Enter an account name'); return; }
    if (id) {
      const a = getAccount(id);
      if (!a) return;
      a.name = name; a.type = type; a.opening_balance = opening;
      touch(a, false);
    } else {
      state.accounts.push(touch({ id: uid(), name: name, type: type, opening_balance: opening, deleted: false }));
    }
    saveState();
    closeSheet();
    render();
    toast('Account saved');
  }

  function saveCategory(id, isDefault) {
    const name = ((document.getElementById('c-name') || {}).value || '').trim();
    const draft = document.getElementById('sheet')._catDraft || {};
    const typeEl = document.getElementById('c-type');
    const type = isDefault === '1' ? (getCategory(id) || {}).type : ((typeEl && typeEl.value) || draft.type || 'expense');
    const icon = ((document.getElementById('c-icon') || {}).value || draft.icon || '📦').trim();
    const color = (document.getElementById('c-color') || {}).value || '#7A847E';
    if (!name) { toast('Enter a name'); return; }
    if (id) {
      const c = getCategory(id);
      if (!c) return;
      c.name = name; c.icon = icon; c.color = color;
      if (!c.is_default) c.type = type;
      touch(c, false);
    } else {
      state.categories.push(touch({ id: uid(), name: name, type: type, icon: icon, color: color, is_default: false, deleted: false }));
    }
    saveState();
    closeSheet();
    if (ui.view === 'add' && !id) {
      const created = state.categories[state.categories.length - 1];
      if (created.type === ui.form.type) ui.form.category_id = created.id;
    }
    render();
    toast('Category saved');
  }

  function saveRule(id) {
    const sheet = document.getElementById('sheet');
    const type = sheet._ruleType || 'expense';
    const amount = parseAmountToPaisa((document.getElementById('r-amt') || {}).value);
    const category_id = (document.getElementById('r-cat') || {}).value;
    const account_id = (document.getElementById('r-acc') || {}).value;
    const frequency = (document.getElementById('r-freq') || {}).value || 'monthly';
    const next = (document.getElementById('r-next') || {}).value;
    const end = (document.getElementById('r-end') || {}).value || null;
    const note = ((document.getElementById('r-note') || {}).value || '').trim();
    const payment_method = (document.getElementById('r-pay') || {}).value || 'Cash';
    if (amount <= 0) { toast('Enter an amount'); return; }
    if (!category_id) { toast('Pick a category'); return; }
    if (!account_id) { toast('Pick an account'); return; }
    if (!next) { toast('Pick a start date'); return; }
    if (end && end < next) { toast('End date is before the next date'); return; }
    if (id) {
      const r = state.recurring_rules.find(function (x) { return x.id === id; });
      if (!r) return;
      Object.assign(r, { type: type, amount: amount, category_id: category_id, account_id: account_id, frequency: frequency, next_run_date: next, end_date: end, note: note, payment_method: payment_method });
      touch(r, false);
    } else {
      state.recurring_rules.push(touch({
        id: uid(), account_id: account_id, category_id: category_id, type: type, amount: amount, note: note,
        frequency: frequency, start_date: next, next_run_date: next, end_date: end, is_active: true, payment_method: payment_method, deleted: false
      }));
      const n = processRecurring();
      if (n) toast(n + (n === 1 ? ' transaction created from the rule' : ' transactions created from the rule'));
    }
    saveState();
    closeSheet();
    render();
    toast('Rule saved');
  }

  /* ---------- export / import / reset ---------- */
  function download(filename, text, mime) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: mime || 'text/plain' }));
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 500);
  }

  function exportCsv() {
    const rows = [['Date', 'Type', 'Amount', 'Category', 'Account', 'Payment Method', 'Note']];
    const list = state.transactions.slice().sort(function (a, b) { return a.date.localeCompare(b.date); });
    list.filter(function (t) { return t && !t.deleted; }).forEach(function (t) {
      const cat = getCategory(t.category_id);
      const acc = getAccount(t.account_id);
      const amt = (t.amount / 100).toFixed(2);
      rows.push([t.date, t.type, amt, cat ? cat.name : '', acc ? acc.name : '', t.payment_method || '', t.note || '']);
    });
    const csv = rows.map(function (r) {
      return r.map(function (cell) {
        const s = String(cell);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\n');
    download('hisab-transactions-' + todayStr() + '.csv', csv, 'text/csv');
    toast('CSV exported');
  }

  function exportJson() {
    download('hisab-backup-' + todayStr() + '.json', JSON.stringify(state, null, 2), 'application/json');
    toast('Backup exported');
  }

  function importJsonFile(file) {
    const reader = new FileReader();
    reader.onload = async function () {
      try {
        const data = JSON.parse(String(reader.result));
        if (!data || !Array.isArray(data.accounts) || !Array.isArray(data.categories) || !Array.isArray(data.transactions)) {
          toast('That file does not look like a Hisab backup');
          return;
        }
        const ok = await confirmDlg('Replace all data?', 'Importing a backup will replace accounts, transactions, budgets and rules on this device.', 'Import', true);
        if (!ok) return;
        data.budgets = data.budgets || [];
        data.recurring_rules = data.recurring_rules || [];
        data.alertLog = data.alertLog || {};
        if (!data.currency) data.currency = 'PKR';
        state = data;
        ['accounts','categories','transactions','budgets','recurring_rules'].forEach(function (n) {
          migrateCollection(state[n] || []);
          (state[n] || []).forEach(function (item) { touch(item, !!item.deleted); });
        });
        saveState();
        applyTheme();
        processRecurring();
        render();
        toast('Backup imported');
      } catch (e) {
        toast('Could not read that file');
      }
    };
    reader.readAsText(file);
  }

  async function resetAllData() {
    const ok = await confirmDlg('Reset all data?', 'Transactions, budgets and recurring rules will be deleted. Accounts and categories will return to defaults. Your PIN and theme stay as they are.', 'Reset', true);
    if (!ok) return;
    const keep = { pinHash: state.pinHash, pinEnabled: state.pinEnabled, currency: state.currency, darkMode: state.darkMode };
    ['accounts','categories','transactions','budgets','recurring_rules'].forEach(function (n) {
      (state[n] || []).forEach(function (item) { touch(item, true); });
    });
    var tombs = {
      accounts: state.accounts || [],
      categories: state.categories || [],
      transactions: state.transactions || [],
      budgets: state.budgets || [],
      recurring_rules: state.recurring_rules || []
    };
    state = seedDefaults();
    state.pinHash = keep.pinHash;
    state.pinEnabled = keep.pinEnabled;
    state.currency = keep.currency;
    state.darkMode = keep.darkMode;
    ['accounts','categories','transactions','budgets','recurring_rules'].forEach(function (n) {
      (state[n] || []).forEach(function (item) { touch(item, false); });
      state[n] = tombs[n].concat(state[n]);
    });
    saveState();
    applyTheme();
    ui.filters = { search: '', dateFrom: '', dateTo: '', categoryId: '', accountId: '', type: '' };
    goto('home', 'home');
    toast('Data reset');
  }

  /* ---------- events ---------- */
  function onClick(e) {
    const el = e.target.closest('[data-act], [data-tab], .tab-add');
    if (!el) {
      if (e.target.id === 'overlay') {
        if (document.getElementById('modal').dataset.busy === '1') return;
        closeSheet();
      }
      return;
    }
    const act = el.getAttribute('data-act');
    const tab = el.getAttribute('data-tab') || (el.classList.contains('tab-add') ? 'add' : null);

    if (el.classList.contains('pin-key') || act === 'pin-key') {
      handlePinKey(el.getAttribute('data-key'));
      return;
    }

    if (act === 'modal-btn') {
      const i = parseInt(el.getAttribute('data-i'), 10);
      const btn = (document.getElementById('modal')._buttons || [])[i] || {};
      closeModal(btn.value);
      return;
    }

    if (tab && !act) {
      if (tab === 'add') {
        ui.form = blankTxnForm('expense');
        ui.returnView = ui.view === 'add' ? (ui.returnView || 'home') : ui.view;
        goto('add');
        return;
      }
      goto(tab, tab);
      return;
    }

    if (act === 'goto') { goto(el.getAttribute('data-view')); return; }
    if (act === 'back') {
      if (ui.view === 'add') goto(ui.returnView || 'home');
      else goto('more', 'more');
      return;
    }
    if (act === 'search-txn') return;
    if (act === 'open-filters') { openFilterSheet(); return; }
    if (act === 'apply-filters') { applyFiltersFromSheet(); return; }
    if (act === 'clear-filters') {
      ui.filters = { search: '', dateFrom: '', dateTo: '', categoryId: '', accountId: '', type: '' };
      closeSheet();
      render();
      return;
    }
    if (act === 'form-type') {
      readAddFormIntoUi();
      const t = el.getAttribute('data-type');
      if (ui.form.type !== t) {
        ui.form.type = t;
        const still = getCategory(ui.form.category_id);
        if (!still || still.type !== t) ui.form.category_id = '';
      }
      render();
      return;
    }
    if (act === 'pick-cat') {
      readAddFormIntoUi();
      ui.form.category_id = el.getAttribute('data-id');
      render();
      return;
    }
    if (act === 'new-cat-inline') {
      readAddFormIntoUi();
      categorySheet(null, ui.form.type);
      return;
    }
    if (act === 'toggle-recurring') {
      readAddFormIntoUi();
      ui.form.makeRecurring = !ui.form.makeRecurring;
      render();
      return;
    }
    if (act === 'save-txn') { saveTransaction(); return; }
    if (act === 'edit-txn') {
      const t = state.transactions.find(function (x) { return x.id === el.getAttribute('data-id'); });
      if (!t) return;
      ui.form = formFromTxn(t);
      ui.returnView = ui.view;
      goto('add');
      return;
    }
    if (act === 'delete-txn') { deleteTransaction(el.getAttribute('data-id')); return; }

    if (act === 'add-budget') { budgetSheet(null); return; }
    if (act === 'edit-budget') { budgetSheet(state.budgets.find(function (b) { return b.id === el.getAttribute('data-id'); })); return; }
    if (act === 'save-budget') { saveBudget(el.getAttribute('data-id') || null); return; }
    if (act === 'delete-budget') {
      confirmDlg('Delete this budget?', 'Progress history for this month will disappear.', 'Delete', true).then(function (ok) {
        if (!ok) return;
        softDeleteById(state.budgets, el.getAttribute('data-id'));
        saveState(); render(); toast('Budget deleted');
      });
      return;
    }

    if (act === 'add-account') { accountSheet(null); return; }
    if (act === 'edit-account') { accountSheet(getAccount(el.getAttribute('data-id'))); return; }
    if (act === 'save-account') { saveAccount(el.getAttribute('data-id') || null); return; }
    if (act === 'delete-account') {
      const id = el.getAttribute('data-id');
      if (active(state.accounts).length <= 1) { toast('Keep at least one account'); return; }
      if (active(state.transactions).some(function (t) { return t.account_id === id; })) { toast('This account has transactions, so it cannot be deleted'); return; }
      if (active(state.recurring_rules).some(function (r) { return r.account_id === id; })) { toast('This account is used by a recurring rule'); return; }
      confirmDlg('Delete this account?', 'You can add it again later.', 'Delete', true).then(function (ok) {
        if (!ok) return;
        softDeleteById(state.accounts, id);
        saveState(); render(); toast('Account deleted');
      });
      return;
    }

    if (act === 'add-category') { categorySheet(null); return; }
    if (act === 'edit-category') { categorySheet(getCategory(el.getAttribute('data-id'))); return; }
    if (act === 'save-category') { saveCategory(el.getAttribute('data-id') || null, el.getAttribute('data-default')); return; }
    if (act === 'pick-icon') {
      const icon = el.getAttribute('data-icon');
      const input = document.getElementById('c-icon');
      if (input) input.value = icon;
      const draft = document.getElementById('sheet')._catDraft || {};
      draft.icon = icon;
      document.getElementById('sheet')._catDraft = draft;
      document.querySelectorAll('#sheet [data-act="pick-icon"]').forEach(function (b) {
        b.classList.toggle('selected', b.getAttribute('data-icon') === icon);
      });
      return;
    }
    if (act === 'delete-category') {
      const id = el.getAttribute('data-id');
      const cat = getCategory(id);
      if (cat && cat.is_default) { toast('Default categories cannot be deleted'); return; }
      if (active(state.transactions).some(function (t) { return t.category_id === id; })) { toast('This category has transactions, so it cannot be deleted'); return; }
      if (active(state.budgets).some(function (b) { return b.category_id === id; }) || active(state.recurring_rules).some(function (r) { return r.category_id === id; })) {
        toast('This category is used by a budget or recurring rule'); return;
      }
      confirmDlg('Delete this category?', 'You can add a new one anytime.', 'Delete', true).then(function (ok) {
        if (!ok) return;
        softDeleteById(state.categories, id);
        saveState(); render(); toast('Category deleted');
      });
      return;
    }

    if (act === 'add-rule') { ruleSheet(null); return; }
    if (act === 'edit-rule') { ruleSheet(state.recurring_rules.find(function (r) { return r.id === el.getAttribute('data-id'); })); return; }
    if (act === 'rule-type') { refreshRuleSheetCats(el.getAttribute('data-type')); return; }
    if (act === 'save-rule') { saveRule(el.getAttribute('data-id') || null); return; }
    if (act === 'toggle-rule') {
      const r = state.recurring_rules.find(function (x) { return x.id === el.getAttribute('data-id'); });
      if (!r) return;
      r.is_active = !r.is_active;
      touch(r);
      if (r.is_active) processRecurring();
      saveState(); render();
      toast(r.is_active ? 'Rule resumed' : 'Rule paused');
      return;
    }
    if (act === 'delete-rule') {
      confirmDlg('Delete this rule?', 'Past transactions generated from it will stay in your history.', 'Delete', true).then(function (ok) {
        if (!ok) return;
        softDeleteById(state.recurring_rules, el.getAttribute('data-id'));
        saveState(); render(); toast('Rule deleted');
      });
      return;
    }

    if (act === 'auth-open') { showAuth(el.getAttribute('data-mode') || 'login'); return; }
    if (act === 'auth-close') { hideAuth(); return; }
    if (act === 'auth-mode') { setAuthMode(el.getAttribute('data-mode') || 'login'); return; }
    if (act === 'auth-submit') { submitAuth(); return; }
    if (act === 'auth-google') { submitGoogle(); return; }
    if (act === 'auth-logout') {
      confirmDlg('Log out?', 'Data already on this phone stays here. Sync pauses until you sign in again.', 'Log out', false).then(function (ok) {
        if (!ok) return;
        window.HisabCloud.signOut().then(function () {
          hideAuth(); render(); updateSyncChip(); toast('Logged out');
        });
      });
      return;
    }
    if (act === 'sync-now') {
      if (!window.HisabCloud || !HisabCloud.isSignedIn()) { toast('Sign in to sync'); return; }
      toast('Syncing…');
      HisabCloud.syncNow().then(function () {
        var st = HisabCloud.getStatus();
        toast(st.kind === 'error' ? (st.error || 'Sync failed') : 'Synced');
        render(); updateSyncChip();
      }).catch(function (err) {
        toast((err && err.message) || 'Sync failed');
      });
      return;
    }
    if (act === 'cloud-delete') {
      confirmDlg('Delete cloud data?', 'This marks the copy in your Firebase account as deleted. Data on this phone is not removed. You will stay signed in unless you log out afterwards.', 'Delete cloud data', true).then(function (ok) {
        if (!ok) return;
        window.HisabCloud.deleteCloudData().then(function () {
          toast('Cloud data deleted');
          render();
        }).catch(function (err) {
          toast((err && err.message) || 'Could not delete cloud data');
        });
      });
      return;
    }
    if (act === 'set-currency') return;
    if (act === 'toggle-theme') {
      state.darkMode = !state.darkMode;
      saveState(); applyTheme(); render();
      return;
    }
    if (act === 'change-pin') { showPin('change-old', 'Enter your current PIN'); return; }
    if (act === 'disable-pin') { showPin('disable', 'Enter your current PIN to disable the lock'); return; }
    if (act === 'enable-pin') { showPin('enable', 'Choose a new 4-digit PIN'); return; }
    if (act === 'export-csv') { exportCsv(); return; }
    if (act === 'export-json') { exportJson(); return; }
    if (act === 'import-json') {
      const input = document.getElementById('import-file');
      if (input) { input.value = ''; input.click(); }
      return;
    }
    if (act === 'reset-data') { resetAllData(); return; }
  }

  function onChange(e) {
    const el = e.target;
    if (el.id === 'fld-account' && ui.form) {
      ui.form.account_id = el.value;
      const pay = document.getElementById('fld-pay');
      const suggested = suggestPayment(el.value);
      if (pay) pay.value = suggested;
      ui.form.payment_method = suggested;
    }
    if (el.id === 'fld-currency' || el.getAttribute('data-act') === 'set-currency') {
      state.currency = el.value;
      saveState();
      render();
    }
    if (el.id === 'import-file' && el.files && el.files[0]) importJsonFile(el.files[0]);
  }

  function onInput(e) {
    if (e.target.id === 'txn-search') {
      ui.filters.search = e.target.value;
      render();
    }
  }

  function onKey(e) {
    if (!document.getElementById('pin-screen').hidden) {
      if (e.key >= '0' && e.key <= '9') handlePinKey(e.key);
      else if (e.key === 'Backspace') handlePinKey('⌫');
      else if (e.key === 'Escape') handlePinKey('C');
    }
  }

  /* ---------- native back button + PWA ---------- */
  function handleHardwareBack() {
    var modal = document.getElementById('modal');
    if (modal && modal.classList.contains('show')) {
      var cancel = modal.querySelector('.btn.secondary') || modal.querySelector('[data-act="modal-btn"]');
      if (cancel) cancel.click();
      else closeModal(false);
      return true;
    }
    var sheet = document.getElementById('sheet');
    if (sheet && sheet.classList.contains('show')) {
      closeSheet();
      return true;
    }
    var auth = document.getElementById('auth-screen');
    if (auth && !auth.hidden) { hideAuth(); return true; }
    var pin = document.getElementById('pin-screen');
    if (pin && !pin.hidden) return false;
    if (ui.view === 'add') {
      goto(ui.returnView || 'home');
      return true;
    }
    if (['budgets', 'accounts', 'categories', 'recurring', 'settings'].indexOf(ui.view) >= 0) {
      goto('more', 'more');
      return true;
    }
    if (ui.view !== 'home') {
      goto('home', 'home');
      return true;
    }
    return false;
  }

  function hookNativeBack() {
    function attach() {
      var cap = window.Capacitor;
      if (!cap) return false;
      var App = (cap.Plugins && cap.Plugins.App) || cap.App;
      if (!App || typeof App.addListener !== 'function') return false;
      App.addListener('backButton', function () {
        if (!handleHardwareBack() && App.exitApp) App.exitApp();
      });
      return true;
    }
    if (attach()) return;
    var n = 0;
    var timer = setInterval(function () {
      n += 1;
      if (attach() || n > 25) clearInterval(timer);
    }, 200);
  }

  function registerPwa() {
    try {
      var cap = window.Capacitor;
      var native = cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform();
      if (native) return;
      if (!('serviceWorker' in navigator)) return;
      if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
      var swUrl = new URL('sw.js', location.href);
      navigator.serviceWorker.register(swUrl.href).catch(function () { /* offline or unsupported */ });
    } catch (err) { /* keep the app working if SW registration fails */ }
  }


  /* ---------- auth screens + cloud hooks ---------- */
  var authMode = 'login';

  function setAuthMode(mode) {
    authMode = mode || 'login';
    var title = document.getElementById('auth-title');
    var lead = document.getElementById('auth-lead');
    var passWrap = document.getElementById('auth-pass-wrap');
    var pass2 = document.getElementById('auth-pass2-wrap');
    var google = document.getElementById('auth-google');
    var submit = document.getElementById('auth-submit');
    var err = document.getElementById('auth-error');
    var toSignup = document.getElementById('auth-goto-signup');
    var toForgot = document.getElementById('auth-goto-forgot');
    var toLogin = document.getElementById('auth-goto-login');
    if (err) err.textContent = '';
    if (mode === 'signup') {
      if (title) title.textContent = 'Create an account';
      if (lead) lead.textContent = 'We will store your ledger in your Firebase account so it can sync.';
      if (passWrap) passWrap.hidden = false;
      if (pass2) pass2.hidden = false;
      if (google) google.hidden = false;
      if (submit) submit.textContent = 'Create account';
      if (toSignup) toSignup.hidden = true;
      if (toForgot) toForgot.hidden = true;
      if (toLogin) toLogin.hidden = false;
    } else if (mode === 'forgot') {
      if (title) title.textContent = 'Reset password';
      if (lead) lead.textContent = 'We will email you a reset link.';
      if (passWrap) passWrap.hidden = true;
      if (pass2) pass2.hidden = true;
      if (google) google.hidden = true;
      if (submit) submit.textContent = 'Send reset link';
      if (toSignup) toSignup.hidden = true;
      if (toForgot) toForgot.hidden = true;
      if (toLogin) toLogin.hidden = false;
    } else {
      if (title) title.textContent = 'Sign in';
      if (lead) lead.textContent = 'Sync your expenses across devices.';
      if (passWrap) passWrap.hidden = false;
      if (pass2) pass2.hidden = true;
      if (google) google.hidden = false;
      if (submit) submit.textContent = 'Sign in';
      if (toSignup) toSignup.hidden = false;
      if (toForgot) toForgot.hidden = false;
      if (toLogin) toLogin.hidden = true;
    }
  }

  function showAuth(mode) {
    setAuthMode(mode || 'login');
    document.getElementById('auth-screen').hidden = false;
    var email = document.getElementById('auth-email');
    if (email) email.focus();
  }

  function hideAuth() {
    document.getElementById('auth-screen').hidden = true;
    var err = document.getElementById('auth-error');
    if (err) err.textContent = '';
  }

  function authError(msg) {
    var err = document.getElementById('auth-error');
    if (err) err.textContent = msg || '';
  }

  async function submitAuth() {
    var cloud = window.HisabCloud;
    if (!cloud || !cloud.isConfigured()) { authError('Cloud sync is not configured.'); return; }
    var email = (document.getElementById('auth-email') || {}).value || '';
    var pass = (document.getElementById('auth-pass') || {}).value || '';
    var pass2 = (document.getElementById('auth-pass2') || {}).value || '';
    authError('');
    try {
      if (authMode === 'forgot') {
        if (!email.trim()) { authError('Enter your email address.'); return; }
        await cloud.resetPassword(email.trim());
        toast('Reset email sent. Check your inbox.');
        setAuthMode('login');
        return;
      }
      if (!email.trim() || !pass) { authError('Enter your email and password.'); return; }
      if (authMode === 'signup') {
        if (pass !== pass2) { authError('Passwords do not match.'); return; }
        await cloud.signUpEmail(email.trim(), pass);
      } else {
        await cloud.signInEmail(email.trim(), pass);
      }
      hideAuth();
      toast(authMode === 'signup' ? 'Account created' : 'Signed in');
      if (ui.view === 'settings') render();
    } catch (err) {
      authError(cloud.friendlyAuthError(err));
    }
  }

  async function submitGoogle() {
    var cloud = window.HisabCloud;
    if (!cloud || !cloud.isConfigured()) { authError('Cloud sync is not configured.'); return; }
    authError('');
    try {
      await cloud.signInGoogle();
      hideAuth();
      toast('Signed in with Google');
      if (ui.view === 'settings') render();
    } catch (err) {
      authError(cloud.friendlyAuthError(err));
    }
  }

  function updateSyncChip() {
    var chip = document.getElementById('sync-chip');
    if (!chip) return;
    var cloud = window.HisabCloud;
    if (!cloud || !cloud.isConfigured() || !cloud.isSignedIn() || !appEntered) {
      chip.hidden = true;
      return;
    }
    var st = cloud.getStatus();
    chip.hidden = false;
    chip.className = st.kind;
    chip.id = 'sync-chip';
    chip.textContent = st.label;
  }

  function replaceCloudCollections(partial) {
    Object.keys(partial || {}).forEach(function (k) {
      if (['accounts','categories','transactions','budgets','recurring_rules'].indexOf(k) >= 0) {
        state[k] = migrateCollection(partial[k] || []);
      }
    });
    saveState({ skipSync: true });
    if (appEntered) render();
    updateSyncChip();
  }

  function startCloud() {
    var cloud = window.HisabCloud;
    if (!cloud) return;
    cloud.init({
      getState: function () { return state; },
      replaceCollections: replaceCloudCollections,
      isAppReady: function () { return appEntered; },
      onStatus: function () {
        updateSyncChip();
        if (appEntered && ui.view === 'settings') render();
      },
      onAuth: function () {
        updateSyncChip();
        if (appEntered && ui.view === 'settings') render();
      },
      onError: function () { /* status chip already updates */ },
      chooseFirstSync: function () {
        return showModal({
          title: 'Use which data?',
          body: 'This phone already has expenses, and so does your account. Upload this phone (replaces the cloud copy), or use the cloud copy (replaces data on this phone). Your PIN stays on this device either way.',
          buttons: [
            { label: 'Upload this phone', className: 'btn', value: 'upload' },
            { label: 'Use cloud data', className: 'btn secondary', value: 'cloud' }
          ]
        }).then(function (v) { return v || 'cloud'; });
      }
    });
  }

  /* ---------- boot ---------- */
  function boot() {
    buildPinPad();
    state = loadState();
    applyTheme();
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    document.addEventListener('keydown', onKey);
    hookNativeBack();
    registerPwa();
    startCloud();
    if (!state.pinEnabled) {
      enterApp();
    } else if (!state.pinHash) {
      showPin('set', 'Create a 4-digit PIN to protect your data');
    } else {
      showPin('unlock', 'Enter your PIN');
    }
  }

  boot();
})();
  </script>
</body>
</html>
